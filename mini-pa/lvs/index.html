<!DOCTYPE html>

<html class="fouc-barrier">

<head class="templates-head">
    <title>BEST Ghent</title>
	<script src="/static/scripts/templates.js" type="module" async="false"></script>

	<!-- This page loads stylesheets with javascript, causing FOUC's. To prevent this, we add this FOUC barrier (which should also be added as a class in the <html> tag).
		When the templates system is finished, it will automatically remove the barrier, making the browser render the page. -->
	<style type="text/css">.fouc-barrier { display: none; }</style>
    
    <!-- The reason this styling happens here and nowhere else is because
     in an ideal world, the style would be applied via a class on the images,
     but as these images are defined in a separate spreadsheet, we can't guarantee
     that those classes will be added. Hence resorting to this solution -->
    <style>
        img {
            width: 100%;
        }
    </style>
</head>

<body class="style-blue">

    <!-- Introduction -->
    <section class="hero sec-img" style="background-image: url('/static/media/pages/home/home.jpg');">
        <div class="overlay-blue">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h1>LVs</h1>
                        <p></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- LV -->
    <section id="lv-display" style="display:none">
        <div class="container">
            <div class="row">
                <div class="col-sm-6">
                    <div id="lv-info">
                        <h1 id="lv-title" class="lv-loading"></h1>
                        <p>
                            <b>Date: </b><span id="lv-date" class="lv-loading"></span>
                            <br>
                            <b>Location: </b><span id="lv-location" class="lv-loading"></span>
                        </p>
                        <p id="lv-description" class="lv-loading"></p>
                    </div>
                    <h3>Agenda</h3>
                    <div id="lv-agenda" class="lv-loading"></div>
                </div>
                <div class="col-sm-6">
                    <div id="lv-signup">
                        <h3>Sign-up</h3>
                        <form id="lv-form" class="form-group">
                            <label for="email">Email address</label>
                            <input id="email" name="email" type="email" class="form-control" autocomplete="on" required placeholder="name.surname@best-eu.org">
                            <label for="attendance">Attendance</label>
                            <select id="attendance" name="attendance" class="form-control">
                                <option value="Present">Present</option>
                                <option value="Late">Late</option>
                                <option value="Not Present">Not Present</option>
                            </select>
                            <a id="lv-signup-button" class="btn btn-blue" onclick="setAttendance();">sign up</a>
                        </form>
                    </div>
                    <h3>Attendance</h3>
                    <div id="lv-attendance" class="lv-loading"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- LV Picker -->
    <section id="lv-picker" class="section-odd">
        <div class="container">
            <div class="row">
                <div class="col-sm-12">
                    <h1>Pick your LV:</h1>
                    <div id="lv-overview">loading...</div>
                </div>
            </div>
        </div>
    </section>
    
    <section class="templates-copyright"></section>

    <div class="templates-nav-main" data-nav-desc="mini-pa-main"></div>

	<!-- Placeholder for javascript imports (imported using the templates.js file) -->
	<div class="templates-scripts"></div>
    <script>
        // This google apps script is owned by karel.best.0503@gmail.com. The script is called Website Public Interface and should be found in Karels root folder on his drive
        const script_url = "https://script.google.com/macros/s/AKfycbxkvtAsfI7JQ29K1XkgoDDlFOjkEjzSp23Ctnm82dnEgfZnOwKaI2L3bTI4nGsUEX_0/exec";

        // Get all possible sheets in the spreadsheet
        sendRequest({
            operation:"get-sheets"
        })
        .then(res => res.json())
        .then(res => {
            if (res.status == null | res.status != "success") throw new Error(res);

            let lvOverview = document.getElementById("lv-overview");
            lvOverview.innerHTML="";
            // res.data.sort(el=>el.name).reverse().forEach(element => {
            res.data.forEach(element => {
                let button = document.createElement("a");
                button.innerHTML = element.name;
                button.classList.add("btn","btn-blue");
                button.onclick = () => {
                    window.location.href = "#"+element.id;
                    loadLV();
                }
                lvOverview.appendChild(button);
            });
        })
        .catch(err => {
            console.log(err);
        });
        
        
        let sheetCache = {};
        // Load the currently selected LV if one is selected
        loadLV();
        function loadLV() {
            let anchor = getAnchor();
            if (anchor == null) { return; }
            document.getElementById("lv-display").style.display='inherit';

            Array.from(document.getElementsByClassName("lv-loading")).forEach(el => {
                el.innerHTML = "loading...";
                Array.from(el.children).forEach(child => el.removeChild(child));
            });

            if (Object.keys(sheetCache).find(el=>(el==anchor))) {
                BuildLV(sheetCache[anchor]);
                return;
            }

            sendRequest({
                operation:"get-sheet",
                id:anchor
            })
            .then(res => res.json())
            .then(res => {
                if (res.status == null | res.status != "success") throw new Error(res);
                sheetCache[anchor] = res.data;
                if (anchor == getAnchor()) BuildLV(res.data); // Only BuildLV() if anchor is still the same after waiting on loading the data
            });
        }
        
        let attendanceEmails = [];
        function BuildLV(rows) {

            let description = {};
            for (let i = 0; i < rows[0].length; i++) {
                let head = rows[0][i];
                if (head == "") continue;
                description[head] = rows[1][i];
            }
            let attendanceHeader  = rows[2].filter(item=> { return item!=""; });
            let attendanceData    = rows.slice(3).map(row => { // Return all rows except the first 3 (which are description header, description data and attendance header)
                return row.filter((el, index) => { // For every row, filter out
                    return rows[2][index] != "";   // When the header row is empty
                });
            })
            .filter(row => { // Also filter out possible empty rows
                isEmpty = true;
                row.map(el => { if (el && el != "") isEmpty = false; });
                return !isEmpty;
            });

            // Gets usefull column indices (-1 of not found)
            let personIndex = attendanceHeader.findIndex(el => el.trim().toLowerCase() == "person");
            let votingRightsIndex = attendanceHeader.findIndex(el => el.trim().toLowerCase() == "voting rights");

            document.getElementById("lv-title").innerHTML        = description["Title"];
            document.getElementById("lv-description").innerHTML  = description["Description"];
            
            // Generate agenda
            let lvAgenda = document.getElementById("lv-agenda");
            let lvAgendaList = document.createElement("ul");
            description["Agenda (seperate topics by \";\")"].split(";").forEach(point => {
                let p = document.createElement("li");
                p.innerHTML = point;
                lvAgendaList.appendChild(p);
            });
            lvAgenda.innerHTML = "";
            lvAgenda.appendChild(lvAgendaList);

            document.getElementById("lv-date").innerHTML     = new Date(description["Date (dd/mm/yyyy hh:MM)"]).toLocaleString(["en"], { year: "numeric", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"});
            document.getElementById("lv-location").innerHTML = description["Location"];
            
            // Generate attendance table
            let lvAttendance = document.getElementById("lv-attendance");
            let lvAttendanceList = document.createElement("table");
            lvAttendanceList.classList.add("table");
            lvAttendanceList.classList.add("table-striped");
            lvAttendanceList.classList.add("table-bordered");
            let lvAttendanceListHeader = document.createElement("thead");
            let lvAttendanceListHeaderRow = document.createElement("tr");
            attendanceHeader.forEach(d => {
                let item = document.createElement("th");
                item.innerHTML = d;
                lvAttendanceListHeaderRow.appendChild(item);
            });
            lvAttendanceListHeader.appendChild(lvAttendanceListHeaderRow);
            lvAttendanceList.appendChild(lvAttendanceListHeader);
            let lvAttendanceListBody = document.createElement("tbody");
            attendanceData.forEach(attend => {
                let p = document.createElement("tr");
                attend.forEach(d => {
                    let item = document.createElement("td");
                    item.innerHTML = d;
                    p.appendChild(item);
                });
                lvAttendanceListBody.appendChild(p);
            });
            lvAttendance.innerHTML = "";
            lvAttendanceList.appendChild(lvAttendanceListBody);
            lvAttendance.appendChild(lvAttendanceList);

            if (personIndex != -1) { // If a person column if present, we can generate statistics about it and compare to currently entered email in the form.
                // Generate statistics
                let lvAttendanceInfo = document.createElement("span");
                let validOnes = attendanceData.filter(el => el[personIndex].includes("@")); // This makes sure entries like Karel are not counted
                if (validOnes.length == 0) {
                    lvAttendanceInfo.innerHTML = "No one signed up yet.";
                }
                else {
                    if (votingRightsIndex != -1) { // There is a voting rights column
                        let confirmed = validOnes.filter(el => el[votingRightsIndex] != '');
                        if (confirmed.length == 0) {
                            lvAttendanceInfo.innerHTML = (validOnes.length == 1) ? "1 person signed up. Awaiting voting rights confirmation." : `${validOnes.length} people signed up. All awaiting voting rights confirmation.`
                        }
                        else {
                            let unconfirmedCount = validOnes.length - confirmed.length;
                            let peopleWithVotingRights = confirmed.filter(el => isAffirmative(el[votingRightsIndex]))
                            let votingRightsCount = peopleWithVotingRights.length;
                            lvAttendanceInfo.innerHTML = `${votingRightsCount} out of ${confirmed.length} ` + ((unconfirmedCount == 0) ? "": "confirmed") + " people have voting rights. "
                                                            + ((unconfirmedCount == 0) ? "" :
                                                                ((unconfirmedCount > 1)  ? `${unconfirmedCount} people awaiting confirmation.` : "One person awaiting confirmation."));
                        }
                    }
                    else {
                        lvAttendanceInfo.innerHTML = (validOnes.length == 1) ? "1 person signed up." : `${validOnes.length} people signed up.`;
                    }
                }
                lvAttendance.appendChild(lvAttendanceInfo);
    
                // Update attendanceEmails with latest info and update signupbutton accordingly
                attendanceEmails = attendanceData.map(row => row[personIndex]);
                updateSignUpButton();
            }
        }

        function isAffirmative(s) {
            switch (s.trim().toLowerCase()) {
                case "y":
                case "yes":
                case "ja":
                case "yep":
                    return true
                return false;
            }
        }

        function getAnchor() {
            let urlParts = document.URL.split('#');
            return (urlParts.length > 1) ? urlParts[1] : null;
        }

        function setAttendance() {
            let anchor = getAnchor();
            if (anchor == null) return;

            let form = document.getElementById("lv-form");
            if (!form.reportValidity()) return;
            let entries = Object.fromEntries(new FormData(form));

            Array.from(document.getElementsByClassName("lv-loading")).forEach(el => {
                el.innerHTML = "loading...";
                Array.from(el.children).forEach(child => el.removeChild(child));
            });

            sendRequest({
                operation:"set-row",
                id:anchor,
                key:entries.email,
                data:[entries.attendance]
            })
            .then(res => res.json())
            .then(res => {
                if (res.status == null | res.status != "success") throw new Error(res);
                
                sheetCache[anchor] = res.data;
                if (anchor == getAnchor()) BuildLV(res.data); // Only BuildLV() if anchor is still the same after waiting on loading the data
            });
        }

        function sendRequest(settings) {
            return fetch(script_url, {
                redirect: "follow",
                method: "POST",
                body: JSON.stringify(settings),
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
            })
        }
        
        // If email is already registered, change SING UP button to UPDATE STATUS
        const button = document.getElementById("lv-signup-button");
        const emailForm = document.getElementById("email");
        emailForm.addEventListener("input", updateSignUpButton);
        function updateSignUpButton() {
            if (attendanceEmails.find(v => emailForm.value == v)) {
                button.innerHTML = "Update status";
            }
            else {
                button.innerHTML = "Sign Up";
            }
        }
    </script>
</body>

</html>
