<!DOCTYPE html>

<html class="fouc-barrier">

<head class="templates-head">
    <title>BEST Ghent</title>
	<script src="/static/scripts/templates.js" type="module" async="false"></script>

	<!-- This page loads stylesheets with javascript, causing FOUC's. To prevent this, we add this FOUC barrier (which should also be added as a class in the <html> tag).
		When the templates system is finished, it will automatically remove the barrier, making the browser render the page. -->
	<style type="text/css">.fouc-barrier { display: none; }</style>
</head>

<body class="style-orange">

    <!-- Introduction -->
    <section class="hero sec-img" style="background-image: url('/static/media/pages/courses/courses.jpg');">
        <div class="overlay-orange">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h1>Karelsweeper</h1>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Welcome -->
    <section>
        <div class="container">
            <div class="row">
                <div class="col-sm-12 text-center">
                    <p>
                        <a id="todays-game-button" class="btn btn-orange">Today's game</a>
                        <label for="seed-game">Seed:</label>
                        <input id="seed-game" name="seed-game" type="text" class="btn btn-orange"></input>
                    </p>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </section>
    
    <section class="templates-copyright"></section>

    <div class="templates-nav-main" data-nav-desc="mini-pa-main"></div>

	<!-- Placeholder for javascript imports (imported using the templates.js file) -->
	<div class="templates-scripts"></div>

	<script src="/static/scripts/random.js"></script>
	<script type="module">
        import { start_game, draw } from "./minesweeper.js";

        const todays_game_button = document.getElementById("todays-game-button");
        todays_game_button.onclick = start_todays_game;
        const seed_game_input = document.getElementById("seed-game");
        seed_game_input.oninput = (e) => { start_seeded_game(seed_game_input.value); };

        function getAnchor() {
            let urlParts = document.URL.split('#');
            return (urlParts.length > 1) ? urlParts[1] : null;
        }

        function start_seeded_game(seed) {
            seed_game_input.value = seed;
            location.href = "#"+seed;
            start_game(canvasDOM, seed, size, bombs);
        }

        function start_todays_game() {
            start_seeded_game((new Date()).toLocaleDateString(["en"], { day: "numeric", month: "numeric", year: "numeric"}));
        }

        const canvasDOM = document.getElementById("canvas");
        const size = {
            width:30,
            height:16
        };
        const bombs = 99;

        if (!getAnchor()) {
            start_todays_game();
        }
        else {
            start_game(canvasDOM, getAnchor(), size, bombs);
        }

    </script>
</body>

</html>
