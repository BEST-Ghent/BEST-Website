<!DOCTYPE html>

<html class="fouc-barrier">
    
<head class="templates-head">
    <title>BEST Ghent</title>
    <script src="/static/scripts/templates.js" type="module" async="false"></script>
    <script src="easy.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
    
    <!-- This page loads stylesheets with javascript, causing FOUC's. To prevent this, we add this FOUC barrier (which should also be added as a class in the <html> tag).
		When the templates system is finished, it will automatically remove the barrier, making the browser render the page. -->
	<style type="text/css">.fouc-barrier { display: none; }</style>
</head>

<body>
    <!-- Introduction -->
    <section class="hero sec-img" style="background-image: url('/static/media/pages/partners/partners_1.jpg');">
        <div class="overlay-black">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">

                        <h1>Make <b>LBG</b> QR codes</h1>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- QR code generator -->
    <section>
        <div class="container">
            <div class="row">
                <div class="col-sm-6 text-center">
                    <h1>Settings</h1>
                    <label for>Text</label><br>
                    <textarea id="text" rows="1" oninput="genQR()">bestghent.eu</textarea>
                    <br>
                    <label>Transparent Background</label>
                    <input id="transparent" type="checkbox" oninput="genQR()" checked>
                    <br>
                    <label>Color</label>
                    <input id="color" type="color" oninput="genQR()">
                    <br>
                    <label>Logo?</label>
                    <input id="logo" type="checkbox" oninput="genQR()" checked>
                    <br>
                    <label>Karel?</label>
                    <input id="logo_karel" type="checkbox" oninput="genQR()" checked>
                    <br>
                    <label>QR size</label><br>
                    <input id="qr_size" type="number" oninput="genQR()" value="400">
                    <br>
                    <label>Logo size</label><br>
                    <input id="logo_size" type="number" oninput="genQR()" value="80">
                    
                </div>
                <div class="col-sm-6 text-center">
                    
                    <div id="qrcode"></div>
                    <a id="download" class="btn btn-blue">Download</a>
                </div>
            </div>
        </div>
    </section>

    <!-- <div class="templates-nav-fullpage" data-nav-desc="documentation-home"></div> -->

	<!-- Placeholder for javascript imports (imported using the templates.js file) -->
	<div class="templates-scripts"></div>

    <script type="text/javascript">
        function genQR() {
            var domel = document.getElementById("qrcode");
            domel.childNodes.forEach(child => {
                domel.removeChild(child);
            });

            var text = document.getElementById("text").value;
            var transparent_bg = document.getElementById("transparent").checked;
            var colorDark = document.getElementById("color").value;
            var colorLight = "white"
            var qr_size = document.getElementById("qr_size").value;
            var logo_size = document.getElementById("logo_size").value;
            var do_logo = document.getElementById("logo").checked;
            var logo_src = document.getElementById("logo_karel").checked?"KAREL.png":"BEST.png";

            var qr = new QRCode(domel, {
                // ====== Basic
                text: text,
                width: qr_size,
                height: qr_size,
                colorDark : colorDark,
                colorLight : transparent_bg?"transparent":colorLight,
                correctLevel : QRCode.CorrectLevel.H, // L, M, Q, H
                
                // ====== dotScale
                /*
                dotScale: 1, // For body block, must be greater than 0, less than or equal to 1. default is 1
                
                dotScaleTiming: 1, // Dafault for timing block , must be greater than 0, less than or equal to 1. default is 1
                dotScaleTiming_H: undefined, // For horizontal timing block, must be greater than 0, less than or equal to 1. default is 1
                dotScaleTiming_V: undefined, // For vertical timing block, must be greater than 0, less than or equal to 1. default is 1
                
                dotScaleA: 1, // Dafault for alignment block, must be greater than 0, less than or equal to 1. default is 1
                dotScaleAO: undefined, // For alignment outer block, must be greater than 0, less than or equal to 1. default is 1
                dotScaleAI: undefined, // For alignment inner block, must be greater than 0, less than or equal to 1. default is 1
                */
            
                // ====== Quiet Zone
                /*
                quietZone: 0,
                quietZoneColor: "rgba(0,0,0,0)",
                */

                // ====== Logo
                
                logo: do_logo?logo_src:undefined, // Relative address, relative to `easy.qrcode.min.js`
                logoWidth: logo_size, // fixed logo width. default is `width/3.5`
                logoHeight: logo_size, // fixed logo height. default is `heigth/3.5`
                logoMaxWidth: undefined, // Maximum logo width. if set will ignore `logoWidth` value
                logoMaxHeight: undefined, // Maximum logo height. if set will ignore `logoHeight` value
                logoBackgroundColor: colorLight, // Logo backgroud color, Invalid when `logBgTransparent` is true; default is '#ffffff'
                logoBackgroundTransparent: false, // Whether use transparent image, default is false
                

                // ====== Backgroud Image
                /*
                backgroundImage: '', // Background Image
                backgroundImageAlpha: 1, // Background image transparency, value between 0 and 1. default is 1. 
                autoColor: false, // Automatic color adjustment(for data block)
                autoColorDark: "rgba(0, 0, 0, .6)", // Automatic color: dark CSS color
                autoColorLight: "rgba(255, 255, 255, .7)", // Automatic color: light CSS color
                */
                
                // ====== Colorful
                // === Posotion Pattern(Eye) Color
                /*
                PO: '#e1622f', // Global Posotion Outer color. if not set, the defaut is `colorDark`
                PI: '#aa5b71', // Global Posotion Inner color. if not set, the defaut is `colorDark`
                PO_TL:'', // Posotion Outer color - Top Left 
                PI_TL:'', // Posotion Inner color - Top Left 
                PO_TR:'', // Posotion Outer color - Top Right 
                PI_TR:'', // Posotion Inner color - Top Right 
                PO_BL:'', // Posotion Outer color - Bottom Left 
                PI_BL:'', // Posotion Inner color - Bottom Left 
                */
                // === Alignment Color
                /*
                AO: '', // Alignment Outer. if not set, the defaut is `colorDark`
                AI: '', // Alignment Inner. if not set, the defaut is `colorDark`
                */
                // === Timing Pattern Color
                /*
                timing: '#e1622f', // Global Timing color. if not set, the defaut is `colorDark`
                timing_H: '', // Horizontal timing color
                timing_V: '', // Vertical timing color
                */
                
                // ====== Title
                /*
                title: 'QR Title', // content 
                titleFont: "normal normal bold 18px Arial", //font. default is "bold 16px Arial"
                titleColor: "#004284", // color. default is "#000"
                titleBackgroundColor: "#fff", // background color. default is "#fff"
                titleHeight: 70, // height, including subTitle. default is 0
                titleTop: 25, // draws y coordinates. default is 30
                */
            
                // ====== SubTitle
                /*
                subTitle: 'QR subTitle', // content
                subTitleFont: "normal normal normal 14px Arial", // font. default is "14px Arial"
                subTitleColor: "#004284", // color. default is "4F4F4F"
                subTitleTop: 40, // draws y coordinates. default is 0
                */
            
                // ===== Event Handler
                
                onRenderingStart: undefined,
                onRenderingEnd: onRenderFinished,
                
            
                // ===== Versions
                /*
                version: 0, // The symbol versions of QR Code range from Version 1 to Version 40. default 0 means automatically choose the closest version based on the text length.
                */     
            
                // ===== Binary(hex) data mode
                /*
                binary: false, // Whether it is binary mode, default is text mode. 
                */ 
                
                // ===== Tooltip
                /*
                tooltip: false, // Whether set the QRCode Text as the title attribute value of the QRCode div
                */
            
                // ==== CORS
                /*
                crossOrigin: null, // String which specifies the CORS setting to use when retrieving the image. null means that the crossOrigin attribute is not set.
                */
            
                // =====  Drawing method
                
                drawer: 'canvas', // Which drawing method to use. 'canvas', 'svg'. default is 'canvas'
                
            
                // =====  UTF-8 without BOM
                /*
                utf8WithoutBOM: true
                */   

            });

            function onRenderFinished() {
                var canvas = domel.childNodes[0];
                if (transparent_bg && do_logo) {
                    var ctx = canvas.getContext('2d');
                    var offset = qr_size/2-logo_size/2;
                    ctx.clearRect(offset,offset,logo_size,logo_size);
                    var logo = new Image();
                    logo.onload = () => {
                        ctx.drawImage(logo, offset,offset, logo_size, logo_size);
                        var downloadButton = document.getElementById("download");
                        downloadButton.href = canvas.toDataURL("image/png");
                        downloadButton.download = "qrcode.png";
                    }
                    logo.src = logo_src;
                }
                else {
                    var downloadButton = document.getElementById("download");
                    downloadButton.href = canvas.toDataURL("image/png");
                    downloadButton.download = "qrcode.png";
                }
            }
        }
        genQR();
        document.getElementById("text").on
    </script>
</body>

</html>
